[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agentic-rag"
version = "0.3.0"
description = "Open-source agentic RAG on LangGraph: routing, planning with parallel retrieval, Corrective RAG, answer verification, text-to-SQL with human approval, memory, budgets, durable state"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["agentic-rag", "rag", "retrieval-augmented-generation", "langgraph", "langchain", "ai-agents", "corrective-rag", "text-to-sql", "human-in-the-loop", "llm"]
requires-python = ">=3.11"
dependencies = [
  # open-rag provides the retrieval stack (hybrid search, chunking, index) as a library.
  # Direct URL pinned to a release tag: a same-named package on PyPI can never be resolved
  # instead (dependency confusion). For local co-development: pip install -e ../open-rag
  "open-rag @ https://github.com/w4coder/open-rag/archive/refs/tags/v0.3.0.tar.gz",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langsmith>=0.2",
  "pydantic-settings>=2.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlglot>=25",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
sqlite = ["langgraph-checkpoint-sqlite>=2"]
postgres = ["langgraph-checkpoint-postgres>=2", "psycopg[binary,pool]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501", "B905", "B007"]
