# Agent next to the open-rag stack: it searches the *same* Qdrant index (ingest with open-rag),
# keeps HITL/memory state in Postgres (any replica can resume a paused run).
name: open-agentic-rag
services:
  agent:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: ../.env
    environment:
      AGENT_CHECKPOINT_URL: postgresql://agent:agent@postgres:5432/agent
      AGENT_REDIS_URL: redis://redis:6379/0
      RAG_QDRANT_URL: http://qdrant:6333
    ports: ["8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      redis: {condition: service_started}
    deploy: {replicas: 2}       # stateless: state lives in Postgres / Qdrant / Redis
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "agent"], interval: 3s, retries: 20}
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes: ["qdrant:/qdrant/storage"]
  redis:
    image: redis:7-alpine
volumes: {pg: {}, qdrant: {}}
